<svg xmlns="http://www.w3.org/2000/svg" width="90" height="90" viewBox="0 0 90 90">
  <defs>
    <style>
      .path { fill: none; stroke: #b8623b; stroke-width: 3.5; stroke-linecap: round; }
      .dot { fill: #b8623b; }
    </style>
  </defs>

  <!-- Top Edge -->
  <path class="path" d="M 30 15 C 40 5, 50 25, 60 15"/>
  <path class="path" d="M 30 15 C 40 25, 50 5, 60 15"/>
  <circle class="dot" cx="45" cy="8" r="3"/>
  <circle class="dot" cx="45" cy="22" r="3"/>

  <!-- Bottom Edge -->
  <path class="path" d="M 30 75 C 40 65, 50 85, 60 75"/>
  <path class="path" d="M 30 75 C 40 85, 50 65, 60 75"/>
  <circle class="dot" cx="45" cy="68" r="3"/>
  <circle class="dot" cx="45" cy="82" r="3"/>

  <!-- Left Edge -->
  <path class="path" d="M 15 30 C 5 40, 25 50, 15 60"/>
  <path class="path" d="M 15 30 C 25 40, 5 50, 15 60"/>
  <circle class="dot" cx="8" cy="45" r="3"/>
  <circle class="dot" cx="22" cy="45" r="3"/>

  <!-- Right Edge -->
  <path class="path" d="M 75 30 C 65 40, 85 50, 75 60"/>
  <path class="path" d="M 75 30 C 85 40, 65 50, 75 60"/>
  <circle class="dot" cx="68" cy="45" r="3"/>
  <circle class="dot" cx="82" cy="45" r="3"/>

  <!-- Top-Left Corner -->
  <path class="path" d="M 30 15 C 20 15, 15 20, 15 30"/>
  <path class="path" d="M 30 15 C 5 0, 0 5, 15 30"/>
  <circle class="dot" cx="12" cy="12" r="3"/>

  <!-- Top-Right Corner -->
  <path class="path" d="M 60 15 C 70 15, 75 20, 75 30"/>
  <path class="path" d="M 60 15 C 85 0, 90 5, 75 30"/>
  <circle class="dot" cx="78" cy="12" r="3"/>

  <!-- Bottom-Left Corner -->
  <path class="path" d="M 30 75 C 20 75, 15 70, 15 60"/>
  <path class="path" d="M 30 75 C 5 90, 0 85, 15 60"/>
  <circle class="dot" cx="12" cy="78" r="3"/>

  <!-- Bottom-Right Corner -->
  <path class="path" d="M 60 75 C 70 75, 75 70, 75 60"/>
  <path class="path" d="M 60 75 C 85 90, 90 85, 75 60"/>
  <circle class="dot" cx="78" cy="78" r="3"/>
</svg>
